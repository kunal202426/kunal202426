name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kunal202426
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=E8560C&color_dots=1c1f15,2a2e1f,d4a574,ff7a33,e8560c
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=E8560C

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
