<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes pop {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.25); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      #trackLine { stroke-dasharray: 680; stroke-dashoffset: 680; animation: draw 2.4s ease-out forwards; }
      .node { animation: pop 0.5s ease-out backwards; transform-box: fill-box; transform-origin: center; }
      .n1 { animation-delay: 0.3s; }
      .n2 { animation-delay: 0.9s; }
      .n3 { animation-delay: 1.5s; }
      .n4 { animation-delay: 2.1s; }
      text { font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="900" height="200" rx="14" fill="#0E0E0B" stroke="#2A2E1F" stroke-width="1.5"/>
  <line id="trackLine" x1="110" y1="100" x2="790" y2="100" stroke="#2A2E1F" stroke-width="3"/>
  <line x1="110" y1="100" x2="790" y2="100" stroke="#E8560C" stroke-width="3" opacity="0.15"/>

  <g class="node n1">
    <circle cx="110" cy="100" r="10" fill="#E8560C"/>
    <circle cx="110" cy="100" r="16" fill="none" stroke="#E8560C" stroke-width="1.5" opacity="0.4"/>
    <text x="110" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#F0EBE0">E-Cell VIT</text>
    <text x="110" y="84" text-anchor="middle" font-size="11" fill="#9B8B70">Junior Core Member</text>
    <text x="110" y="134" text-anchor="middle" font-size="11" fill="#D4C4A8">2023 – 2024</text>
  </g>

  <g class="node n2">
    <circle cx="337" cy="100" r="10" fill="#E8560C"/>
    <circle cx="337" cy="100" r="16" fill="none" stroke="#E8560C" stroke-width="1.5" opacity="0.4"/>
    <text x="337" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#F0EBE0">Team Levitate Hyperloop</text>
    <text x="337" y="84" text-anchor="middle" font-size="11" fill="#9B8B70">Senior Engineer — AI &amp; Software</text>
    <text x="337" y="134" text-anchor="middle" font-size="11" fill="#D4C4A8">2024 – 2025</text>
  </g>

  <g class="node n3">
    <circle cx="563" cy="100" r="10" fill="#E8560C"/>
    <circle cx="563" cy="100" r="16" fill="none" stroke="#E8560C" stroke-width="1.5" opacity="0.4"/>
    <text x="563" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#F0EBE0">YES Securities</text>
    <text x="563" y="84" text-anchor="middle" font-size="11" fill="#9B8B70">Full Stack Developer Intern</text>
    <text x="563" y="134" text-anchor="middle" font-size="11" fill="#D4C4A8">Jan – Aug 2026</text>
  </g>

  <g class="node n4">
    <circle cx="790" cy="100" r="10" fill="#E8560C"/>
    <circle cx="790" cy="100" r="16" fill="none" stroke="#E8560C" stroke-width="1.5" opacity="0.4"/>
    <text x="790" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#F0EBE0">Astra</text>
    <text x="790" y="84" text-anchor="middle" font-size="11" fill="#9B8B70">Founding Engineer</text>
    <text x="790" y="134" text-anchor="middle" font-size="11" fill="#D4C4A8">Sep 2026 – Present</text>
  </g>
</svg>
