<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes pop {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.25); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      #trackLine { stroke-dasharray: 760; stroke-dashoffset: 760; animation: draw 2.2s ease-out forwards; }
      .node { animation: pop 0.5s ease-out backwards; transform-box: fill-box; transform-origin: center; }
      .n1 { animation-delay: 0.3s; }
      .n2 { animation-delay: 1.1s; }
      .n3 { animation-delay: 1.9s; }
      text { font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="900" height="200" rx="14" fill="#0E0E0B" stroke="#2A2E1F" stroke-width="1.5"/>
  <line id="trackLine" x1="70" y1="100" x2="830" y2="100" stroke="#2A2E1F" stroke-width="3"/>
  <line x1="70" y1="100" x2="830" y2="100" stroke="#E8560C" stroke-width="3" opacity="0.15"/>

  <g class="node n1">
    <circle cx="130" cy="100" r="10" fill="#E8560C"/>
    <circle cx="130" cy="100" r="16" fill="none" stroke="#E8560C" stroke-width="1.5" opacity="0.4"/>
    <text x="130" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#F0EBE0">E-Cell VIT</text>
    <text x="130" y="84" text-anchor="middle" font-size="11" fill="#9B8B70">Junior Core Member</text>
    <text x="130" y="134" text-anchor="middle" font-size="11" fill="#D4C4A8">2023 – 2024</text>
  </g>

  <g class="node n2">
    <circle cx="465" cy="100" r="10" fill="#E8560C"/>
    <circle cx="465" cy="100" r="16" fill="none" stroke="#E8560C" stroke-width="1.5" opacity="0.4"/>
    <text x="465" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#F0EBE0">Team Levitate Hyperloop</text>
    <text x="465" y="84" text-anchor="middle" font-size="11" fill="#9B8B70">Senior Engineer — AI &amp; Software</text>
    <text x="465" y="134" text-anchor="middle" font-size="11" fill="#D4C4A8">2024 – 2025</text>
  </g>

  <g class="node n3">
    <circle cx="800" cy="100" r="10" fill="#E8560C"/>
    <circle cx="800" cy="100" r="16" fill="none" stroke="#E8560C" stroke-width="1.5" opacity="0.4"/>
    <text x="800" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#F0EBE0">YES Securities</text>
    <text x="800" y="84" text-anchor="middle" font-size="11" fill="#9B8B70">Full Stack Developer Intern</text>
    <text x="800" y="134" text-anchor="middle" font-size="11" fill="#D4C4A8">2026 – Present</text>
  </g>
</svg>
