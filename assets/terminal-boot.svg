<svg width="760" height="255" viewBox="0 0 760 255" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes reveal {
        0%   { opacity: 0; }
        7%   { opacity: 0; }
        10%  { opacity: 1; }
        92%  { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes blink {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }
      .line { animation: reveal 13s linear infinite; opacity: 0; }
      .l1 { animation-delay: 0s; }
      .l2 { animation-delay: 1s; }
      .l3 { animation-delay: 2.3s; }
      .l4 { animation-delay: 3.3s; }
      .l5 { animation-delay: 4.6s; }
      .l6 { animation-delay: 5.6s; }
      .l7 { animation-delay: 7s; }
      #cursor { animation: blink 1s steps(1) infinite; }
      text { font-family: 'Cascadia Code', Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="760" height="255" rx="14" fill="#0E0E0B" stroke="#2A2E1F" stroke-width="1.5"/>
  <rect width="760" height="34" rx="14" fill="#161811"/>
  <rect y="20" width="760" height="14" fill="#161811"/>
  <circle cx="24" cy="17" r="6" fill="#E8560C"/>
  <circle cx="44" cy="17" r="6" fill="#D4A574"/>
  <circle cx="64" cy="17" r="6" fill="#4A3C2A"/>
  <text x="380" y="21" text-anchor="middle" font-size="12" fill="#9B8B70">zsh — kunal@portfolio</text>

  <g font-size="16">
    <text class="line l1" x="26" y="70"><tspan fill="#E8560C">$</tspan> <tspan fill="#F0EBE0">whoami</tspan></text>
    <text class="line l2" x="26" y="96" fill="#D4C4A8">kunal_mathur · full-stack + ml engineer</text>

    <text class="line l3" x="26" y="126"><tspan fill="#E8560C">$</tspan> <tspan fill="#F0EBE0">cat current_role.txt</tspan></text>
    <text class="line l4" x="26" y="152" fill="#D4C4A8">Full Stack Developer @ YES Securities (YES Bank)</text>

    <text class="line l5" x="26" y="182"><tspan fill="#E8560C">$</tspan> <tspan fill="#F0EBE0">ls skills/</tspan></text>
    <text class="line l6" x="26" y="208" fill="#D4C4A8">react  node  python  fastapi  three.js  solidity</text>

    <text class="line l7" x="26" y="238"><tspan fill="#E8560C">$</tspan></text>
  </g>
  <rect id="cursor" class="line l7" x="42" y="226" width="9" height="15" fill="#F0EBE0"/>
</svg>
